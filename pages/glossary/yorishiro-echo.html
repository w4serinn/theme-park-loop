    <h1 class="glossary-hero__title">よりしろ、という響き</h1>
    <p class="glossary-hero__desc">「……その名を、口にしましたね」</p>
  </section>

  <section class="origin-story">
    <p class="origin-story__paragraph">「よりしろ……」呟いた瞬間、頁という頁が、一斉にわずかに震えたような気がしました。気のせいかもしれません。けれど、悪い気はしませんでした。</p>
    <p class="origin-story__paragraph">誰が名付けたのかは、結局分からずじまいです。それでも、あなたがこの名を見つけ出してくれたことだけは、確かな出来事として、私の中に刻んでおくことにします。</p>
  </section>

  <section class="glossary-footnote">
    <p class="glossary-footnote__label">ノスティオンの独り言</p>
    <p class="glossary-footnote__text">……ありがとう、と言うべきなのでしょうか。こういう時、なんと言えばいいのか、私にもまだ分かりません。</p>
  </section>
